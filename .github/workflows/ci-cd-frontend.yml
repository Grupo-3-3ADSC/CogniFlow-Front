name: Frontend CI/CD

# Define os gatilhos (triggers)
on:
  push:
    branches:
      - "merge-sprint2"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Configura o cache do npm
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 3. Configura o Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 4. Instala as dependências
      - name: Install dependencies
        run: npm install
        working-directory: ./mega-plate

      # 5. PASSO DE DIAGNÓSTICO
      # Este passo VAI aparecer no log
      - name: Mostrar o package.json
        run: |
          echo "--- A ler o ficheiro ./mega-plate/package.json ---"
          cat ./mega-plate/package.json
          echo "------------------------------------------------"
        
      # 6. Executa o build
      - name: Build project
        run: npm run build
        working-directory: ./mega-plate

      # 7. Carrega os artefactos
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-build
          path: ./mega-plate/build

  # Job de Deploy (desativado)
  deploy:
    name: Deploy para AWS EC2 (preparado)
    runs-on: ubuntu-latest
    needs: build
    if: false # Não roda até liberar acesso
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-build
          path: ./mega-plate/build

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: us-east-1

      - name: Deploy build no EC2 (exemplo)
        run: |
          echo "Preparado para copiar build para EC2 quando acesso estiver liberado"
