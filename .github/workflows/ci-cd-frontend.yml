name: Frontend CI/CD

on: 
  push:
    branches:
      - "develop-onCloud"
  pull_request:
    branches:
      - "main"

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy and Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            echo "=== Iniciando deploy do frontend ==="
            
            # Navega para o diretório do projeto
            cd /var/www/html/projeto/CogniFlow-Front
            
            # Verifica se estamos no repositório correto
            if [ ! -d ".git" ]; then
              echo "ERRO: Não é um repositório Git válido!"
              exit 1
            fi
            
            echo "=== Atualizando repositório ==="
            # Salva alterações locais se houver
            git stash || true
            
            # Atualiza o repositório
            git fetch origin
            git checkout develop-onCloud
            git pull origin develop-onCloud
            
            # Restaura alterações locais se houver
            git stash pop || true
            
            echo "=== Parando containers ==="
            cd /var/www/html/projeto
            sudo docker compose down || true
            
            echo "=== Limpando imagens antigas ==="
            # Remove apenas a imagem do frontend para forçar rebuild
            sudo docker rmi projeto-app1 || true
            
            echo "=== Buildando e iniciando containers ==="
            # Build e start dos containers
            sudo docker compose build --no-cache app1
            sudo docker compose up -d
            
            echo "=== Verificando status dos containers ==="
            sudo docker compose ps
            
            echo "=== Limpando recursos não utilizados ==="
            sudo docker system prune -f
            
            echo "=== Deploy concluído com sucesso! ==="
            echo "Frontend atualizado e rodando na porta 80"
