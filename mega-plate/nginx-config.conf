 server {
     listen 80;
     server_name 52.200.194.209

     root /var/www/html/dist;
     index index.html;

     location / {
         try_files $uri $uri/ /index.html;
     }

     location /api/ {
         proxy_pass http://10.0.0.211:8080/;
         proxy_http_version 1.1;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
     }
 }
