name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - fix/tabela-formatada
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./mega-plate

      - name: Build project
        run: npm run build
        working-directory: ./mega-plate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-build
          path: ./mega-plate/build

  deploy:
    name: Deploy para AWS EC2 (preparado)
    runs-on: ubuntu-latest
    needs: build
    if: false # não roda até liberar acesso
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-build
          path: ./mega-plate/build

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
      #    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy build no EC2 (exemplo)
        run: |
          echo "Preparado para copiar build para EC2 quando acesso estiver liberado"
