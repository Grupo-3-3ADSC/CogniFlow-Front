name: Frontend CI/CD

on:
  push:
    branches: [ merge-sprint2 ]
  pull_request:
    branches: [ merge-sprint2 ]
  workflow_dispatch:

jobs:
  # ==========================================
  # CI - Testes e Validações
  # ==========================================
  ci:
    name: CI - Build e Validação
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Verificar Linting
      run: npm run lint || echo "⚠️ Linting com warnings"
      continue-on-error: true

    - name: Rodar testes
      run: npm test || echo "⚠️ Testes não configurados"
      continue-on-error: true

    - name: Build de validação
      run: npm run build

    - name: Verificar tamanho do build
      run: |
        echo " Tamanho do build:"
        du -sh dist/ || du -sh build/
        
    - name: CI aprovado
      run: echo " Build validado! Pronto para deploy."

  # ==========================================
  # CD - Deploy para EC2
  # ==========================================
  deploy:
    name: Deploy para EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/merge-sprint2')
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Deploy para EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        command_timeout: 10m
        script: |
          set -e
          
          echo "======================================"
          echo " INICIANDO DEPLOY DO COGNIFLOW"
          echo "======================================"
          echo " Branch: ${{ github.ref_name }}"
          echo " Commit: ${{ github.sha }}"
          echo " Autor: ${{ github.actor }}"
          echo " Início: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          
          # Navegar para diretório
          cd /var/www/cogniflow
          
          # Backup do build anterior
          if [ -d "dist" ]; then
            echo " Criando backup do build anterior..."
            BACKUP_DIR="dist.backup.$(date +%Y%m%d_%H%M%S)"
            sudo cp -r dist "$BACKUP_DIR"
            echo " Backup criado: $BACKUP_DIR"
            
            # Manter apenas últimos 3 backups
            ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs sudo rm -rf 2>/dev/null || true
            echo ""
          fi
          
          # Verificar Git
          if [ ! -d .git ]; then
            echo " ERRO: Não é um repositório git!"
            exit 1
          fi
          
          # Salvar mudanças locais
          echo " Salvando mudanças locais..."
          git stash
          
          # Atualizar código
          echo " Atualizando código..."
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          echo " Código atualizado para commit: $(git rev-parse --short HEAD)"
          echo ""
          
          # Verificar Node.js
          echo " Verificando ambiente..."
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo ""
          
          # Instalar dependências
          echo " Instalando dependências..."
          npm ci
          echo " Dependências instaladas"
          echo ""
          
          # Build da aplicação
          echo " Buildando aplicação..."
          npm run build
          
          # Verificar se build foi criado
          if [ ! -d "dist" ]; then
            echo " ERRO: Pasta dist não foi criada!"
            echo " Restaurando backup..."
            if [ -n "$BACKUP_DIR" ] && [ -d "$BACKUP_DIR" ]; then
              sudo mv "$BACKUP_DIR" dist
              echo " Backup restaurado"
            fi
            exit 1
          fi
          
          echo " Build criado com sucesso"
          echo " Tamanho: $(du -sh dist/ | cut -f1)"
          echo ""
          
          # Configurar permissões
          echo " Configurando permissões..."
          sudo chown -R www-data:www-data dist/
          sudo chmod -R 755 dist/
          echo " Permissões configuradas"
          echo ""
          
          # Reiniciar backend (se existir)
          if command -v pm2 &> /dev/null; then
            if pm2 list | grep -q "cogniflow"; then
              echo " Reiniciando backend PM2..."
              pm2 restart cogniflow
              echo " Backend reiniciado"
            fi
          fi
          
          # Recarregar Nginx
          echo " Recarregando Nginx..."
          if sudo nginx -t; then
            sudo systemctl reload nginx
            echo " Nginx recarregado"
          else
            echo " ERRO: Configuração do Nginx inválida!"
            exit 1
          fi
          
          echo ""
          echo "======================================"
          echo " DEPLOY CONCLUÍDO COM SUCESSO!"
          echo "======================================"
          echo " URL: http://${{ secrets.EC2_HOST }}"
          echo " Finalizado: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "======================================"

    - name: Resumo do Deploy
      if: success()
      run: |
        echo "##  Deploy Realizado com Sucesso!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "-  **URL:** http://${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
        echo "-  **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "-  **Autor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "-  **Horário:** $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        
    - name: Alerta de Falha
      if: failure()
      run: |
        echo "##  Deploy Falhou!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo " O build anterior foi mantido como backup" >> $GITHUB_STEP_SUMMARY
        echo " Verifique os logs acima para detalhes" >> $GITHUB_STEP_SUMMARY